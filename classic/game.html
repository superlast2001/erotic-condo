<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0810"><meta name="robots" content="noindex">
<title>Erotic Condo — 18+ game</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E🏙️%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/game.css">
</head><body>
<div id="app">
  <div id="view">
    <div id="hud"><span class="chip gold" id="hMoney">£0</span><span class="chip" id="hDay">Day 1</span></div>
    <button class="fab" id="consoleToggle" aria-label="Hide console" aria-pressed="false">▼ Hide console</button>
    <button class="fab hidden" id="backBtn" aria-label="Back to condo">◀ Condo</button>
    <button class="fab hidden" id="dayFab" aria-label="Next day">☀ Next day</button>

    <div id="condoView"><div id="building"></div></div>

    <div id="sceneView" class="hidden">
      <div id="sceneBg"></div>
      <div id="figure">
        <img id="fig" alt="" draggable="false">
        <div id="blush"></div>
        <svg id="hot" viewBox="0 0 768 1024" preserveAspectRatio="none" aria-hidden="true"></svg>
        <div id="fx"></div>
        <div id="miniMeters"><i class="a"></i><i class="t"></i></div>
      </div>
      <div id="vignette"></div>
      <div id="zonelabel"></div>
      <div id="caption"></div>
    </div>
  </div>

  <div id="console">
    <div id="conCondo" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <div class="tabs" id="tabs">
        <button class="tab on" data-tab="condo">🏢 Condo</button>
        <button class="tab" data-tab="people">👥 People</button>
        <button class="tab" data-tab="log">📜 Log</button>
        <button class="tab" data-tab="set">⚙ Settings</button>
      </div>
      <div class="pane" id="pane"></div>
    </div>
    <div id="conScene" class="hidden">
      <div class="meter"><span>Arousal</span><div class="bar ar"><i id="arBar"></i></div><b id="arVal">0</b></div>
      <div class="meter"><span>Trust</span><div class="bar tr"><i id="trBar"></i><u id="trNeed"></u></div><b id="trVal">0</b></div>
      <div id="dialog"><div id="speaker">—</div><div id="stagebadge">Guarded</div><div id="dtext"></div></div>
      <div id="scenebar">
        <button class="btn sm" id="sGift">🎁 Gift / food</button>
        <button class="btn sm" id="sDate">💞 Date</button>
        <button class="btn sm" id="sInfo">ℹ Info</button>
      </div>
      <div id="hint">Tap, drag to stroke, or hold on a body zone. Trust marker (white) = needed for the finale.</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="finale"><div id="ftext"></div><div id="fhint">tap to continue</div><button class="btn primary hidden" id="fbtn">Continue</button></div>

<script src="js/beats.js"></script>
<script src="js/chars_a.js"></script>
<script src="js/chars_b.js"></script>
<script src="js/app.js"></script>
</body></html>
